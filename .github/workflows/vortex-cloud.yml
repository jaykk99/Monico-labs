name: Vortex Cloud

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Restart every 5h55m — stays under GitHub Actions 6h job limit
    # concurrency.cancel-in-progress kills the old job before the new one locks in
    - cron: '55 */5 * * *'

concurrency:
  group: vortex-cloud
  cancel-in-progress: true

jobs:
  serve:
    name: Run Vortex Server
    runs-on: ubuntu-latest
    timeout-minutes: 355

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Start Vortex
        run: node dist/server.cjs
        env:
          PORT: 3000
          NODE_ENV: production
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_CLIENT_ID: ${{ secrets.GITHUB_CLIENT_ID }}
